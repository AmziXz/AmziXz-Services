faq:
  label: "Questions"
  title: "Worth answering"
  title_accent: "up front."
  items:
    - question: "Why is there no price list?"
      answer: "Because a number without a scope is a guess. A five-section marketing site and a five-screen application are both “a website” until someone asks what is actually in them. Tell us what you need and you get a real fixed price instead of a range you cannot rely on."
    - question: "Do I own what you build?"
      answer: "Yes. Development work is handed over with its source, and you can host it, change it, or take it to another developer. There is no lock-in and nothing is held back."
    - question: "How long does a project take?"
      answer: "A landing page is usually days rather than weeks; a full site or an application depends entirely on scope. You get a timeline with the quote, before any work starts."
    - question: "What does it cost to keep a site running?"
      answer: "Often nothing beyond your domain. Static sites can be hosted free on GitHub Pages, as this site and amzixz.id.lv both are. If your project needs a server or paid services, we tell you what they cost before you commit."

