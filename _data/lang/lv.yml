faq:
  label: "Jautājumi"
  title: "Ko vērts zināt"
  title_accent: "jau sākumā."
  items:
    - question: "Kāpēc nav cenrāža?"
      answer: "Jo cena bez darba apjoma ir minējums. Piecu sadaļu mārketinga mājaslapu un piecu ekrānu lietotni abas sauc par „mājaslapu”, līdz kāds pajautā, kas tajās patiesībā ir. Pastāstiet, kas Jums vajadzīgs, un saņemsiet reālu, fiksētu cenu, nevis cenu diapazonu, uz kuru nevar paļauties."
    - question: "Vai tas, ko izstrādājat, pieder man?"
      answer: "Jā. Izstrādātais darbs tiek nodots kopā ar pirmkodu, un Jūs to varat mitināt, mainīt vai nodot citam izstrādātājam. Nekādu saistību, nekas netiek paturēts."
    - question: "Cik ilgi notiek izstrāde?"
      answer: "Vienas lapas mājaslapa parasti aizņem dienas, nevis nedēļas; pilnas mājaslapas vai lietotnes izstrādes laiks ir atkarīgs no apjoma. Termiņu saņemat kopā ar piedāvājumu, pirms darbs sākas."
    - question: "Cik izmaksā mājaslapas uzturēšana?"
      answer: "Bieži vien neko, izņemot domēnu. Statiskas mājaslapas var bez maksas mitināt GitHub Pages, tāpat kā šo vietni un amzixz.id.lv. Ja projektam vajadzīgs serveris vai maksas pakalpojumi, pastāstām, cik tie izmaksā, pirms pieņemat lēmumu."

