# KĀ LABOT
#   Mainiet tekstu starp pēdiņām. Visu pārējo atstājiet, kā ir.
#
#     title: "Jūs vēlaties,"              <- mainiet šo daļu
#     ^^^^^                                   nekad šo (atslēgu)
#
#   - Katram tekstam jāpaliek pēdiņās "…".
