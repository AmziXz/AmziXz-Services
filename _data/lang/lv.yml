#   - Rindas, kas sākas ar #, ir piezīmes kā šī. Lapā tās neparādās.
#   - "_accent" teksti ir virsraksta zeltītās beigas.
#   - en.yml ir tieši tādas pašas atslēgas. Ja šeit pievienojat vai dzēšat
#     rindu, dariet to pašu tur.
#
# JA KAUT KO SALAUŽAT
#   Izmaiņas netiks publicētas. Iepriekšējā versija paliek tiešsaistē, un
#   GitHub atsūta e-pastu, ka Pages būvējums neizdevās. Atsauciet labojumu
#   (vai izlabojiet salauzto pēdiņu/atkāpi) un saglabājiet vēlreiz.

