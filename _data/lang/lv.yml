faq:
  label: "Jautājumi"
  title: "Vērts atbildēt"
  title_accent: "uzreiz."
  items:
    - question: "Kāpēc nav cenrāža?"
      answer: "Jo cena bez apjoma ir minējums. Piecu sadaļu mārketinga vietne un piecu ekrānu lietotne abas ir „mājaslapa”, līdz kāds pajautā, kas tajās patiesībā ir. Pastāstiet, kas Jums vajadzīgs, un saņemsiet reālu, fiksētu cenu, nevis diapazonu, uz kuru nevar paļauties."
    - question: "Vai tas, ko izstrādājat, pieder man?"
      answer: "Jā. Izstrādes darbs tiek nodots kopā ar pirmkodu, un Jūs to varat izvietot, mainīt vai nodot citam izstrādātājam. Nekādas piesaistes, nekas netiek paturēts."
    - question: "Cik ilgi aizņem projekts?"
      answer: "Vienas lapas vietne parasti prasa dienas, nevis nedēļas; pilna vietne vai lietotne ir atkarīga no apjoma. Termiņu saņemat kopā ar piedāvājumu, pirms darbs sākas."
    - question: "Cik izmaksā vietnes uzturēšana?"
      answer: "Bieži vien neko, izņemot domēnu. Statiskas vietnes var bez maksas izvietot GitHub Pages, tāpat kā šo vietni un amzixz.id.lv. Ja projektam vajadzīgs serveris vai maksas pakalpojumi, mēs pastāstām, cik tie izmaksā, pirms Jūs piekrītat."

