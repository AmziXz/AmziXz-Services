# GitHub Pages builds this site with Jekyll. It does three jobs here:
#
# 1. Builds index.html and lv/index.html from _layouts/home.html and the
#    wording in _data/lang/*.yml.
# 2. Fails the build on a missing or misspelled key instead of publishing a
#    blank. A failed build leaves the previous version live, and GitHub
#    emails the owner.
# 3. Keeps working notes and local tooling off the public site.

# Used for canonical URLs, hreflang and the sitemap. Deliberately not
# site.url: GitHub's metadata plugin rewrites that one.
origin: "https://services.amzixz.id.lv"

# The ?v=N cache-buster on every /assets reference. Bump it after changing
# anything in /assets; one number, every page follows.
asset_version: 4

liquid:
  error_mode: strict
  strict_filters: true
  strict_variables: true

exclude:
  - README.md
  - CLAUDE.md
  - design-system/
  - package.json
  - package-lock.json
  - serve.js
  - check.js
  - node_modules/
